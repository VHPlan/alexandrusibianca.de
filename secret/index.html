<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfbf8">
  <meta name="robots" content="noindex, nofollow">
  <title>Acces privat — AB</title>
  <meta name="description" content="Acces privat.">
  <meta property="og:title" content="Acces privat">
  <meta property="og:description" content="AB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@300;400;500&family=Great+Vibes&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/secret/secret.css?v=s7">
</head>
<body>
  <div class="spot" aria-hidden="true"></div>
  <div class="candle" aria-hidden="true"></div>
  <div class="hush" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- 1 · ACCES SECRET -->
  <section class="gate" id="gate">
    <div class="gate__in" id="gateIn">
      <div class="g-mono"><span>AB</span></div>
      <span class="g-stem" aria-hidden="true"></span>
      <p class="g-eyebrow">Acces privat</p>
      <p class="g-q">Aveți cheia?</p>

      <form class="g-form" id="gForm" autocomplete="off" novalidate>
        <label class="g-field">
          <input id="gCode" name="code" type="text" inputmode="text" autocapitalize="characters" autocorrect="off"
                 spellcheck="false" maxlength="64" placeholder="Introdu codul" aria-label="Introdu codul">
          <span class="g-line" aria-hidden="true"></span>
        </label>
        <p class="g-err" id="gErr" role="alert" aria-live="assertive"></p>
        <button class="btn btn--line g-btn" id="gBtn" type="submit"><span>Deblochează</span><i aria-hidden="true"></i></button>
      </form>
    </div>

    <div class="g-ok" aria-live="polite">
      <span class="g-beam" aria-hidden="true"></span>
      <p class="g-ok__txt">Cheia a fost acceptată</p>
    </div>
  </section>

  <!-- film (filled only after the key is accepted) -->
  <div class="bars" id="bars" aria-hidden="true"></div>
  <main class="film" id="film" aria-live="polite"></main>
  <div class="tap" id="tap" aria-hidden="true"><i></i><span>Atinge ecranul</span></div>

  <button class="music" id="music" type="button" aria-label="Muzică" aria-pressed="false"><span>♪</span></button>

  <div class="frame" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <script src="/secret/secret.js?v=s7"></script>
</body>
</html>
